# Air-gapped stack: techrag (API + UI) + Ollama (LLM). See README "Docker ile kurulum".
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama          # copy pre-pulled model weights into ./ollama/models
    # GPU (NVIDIA Container Toolkit required) - uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  techrag:
    image: techrag:latest
    build: .
    restart: unless-stopped
    depends_on: [ollama]
    ports:
      - "8000:8000"
    environment:
      TECHRAG_LLM__BASE_URL: http://ollama:11434
      TECHRAG_EMBEDDING__BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data                # sources + index
      - ./models:/app/models:ro         # bge-m3, bge-reranker-v2-m3
      - ./config:/app/config:ro
