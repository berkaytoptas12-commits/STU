  gecikme: latency delay
  gerilim: voltage
  voltaj: voltage
  akım: current
  güç: power
  frekans: frequency
  saat: clock
  hız: speed rate
  veri hızı: data rate
  bant genişliği: bandwidth
  empedans: impedance
  sonlandırma: termination
  direnç: resistor resistance
  kapasitans: capacitance
  kapasite: capacitance
  kablo: cable
  uzunluk: length
  mesafe: distance length
  konnektör: connector
  bağlayıcı: connector
  pin: pin
  bacak: pin
  sinyal: signal
  diferansiyel: differential
  ortak mod: common-mode
  gürültü: noise
  yükselme süresi: rise time
  düşme süresi: fall time
  kurulum süresi: setup time
  tutma süresi: hold time
  çerçeve: frame
  paket: packet
  kelime: word
  etiket: label
  adres: address
  kayıt: register
  yazmaç: register
  bit: bit
  bayt: byte
  eşlik: parity
  hata: error
  hata düzeltme: error correction
  kodlama: encoding
  kod çözme: decoding
  şerit: lane
  bağlantı: link
  eğitim: training
  eşitleme: equalization
  durum makinesi: state machine
  durum: state status
  yenileme: refresh
  başlatma: initialization
  sıfırlama: reset
  güç yönetimi: power management
  uyku: sleep suspend
  bekleme: idle standby
  besleme: supply
  topraklama: ground grounding
  ekranlama: shielding
  yalıtım: isolation
  sıcaklık: temperature
  titreşim: vibration
  sertifikasyon: certification
  doğrulama: verification validation
  gereksinim: requirement
  maksimum: maximum
  minimum: minimum
  en fazla: maximum
  en az: minimum
  değer: value
  aralık: range interval
  süre: duration time period
  periyot: period
  tolerans: tolerance
  kenar: edge
  yükselen: rising
  düşen: falling
  alıcı: receiver
  verici: transmitter driver
  sürücü: driver
  ana cihaz: master controller host
  köle: slave target
  hedef: target
  denetleyici: controller
  yol: bus path
  veri yolu: bus
