  bellek: memory
  modül: module
  sayfa: page
  satır: row
  sütun: column
  okuma: read
  yazma: write
  komut: command
  gecikme süresi: latency
  çözünürlük: resolution
  renk derinliği: color depth bpp
  sıkıştırma: compression
  sıcak takma: hot plug
  şarj: charging
  akım sınırı: current limit
  yük: load
  birim yük: unit load
  çekme direnci: pull-up resistor
  yukarı çekme: pull-up
