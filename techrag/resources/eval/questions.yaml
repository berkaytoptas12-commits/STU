# ------------------------------------------------------------------ I2C
- id: i2c-01
  status: draft
  kind: value
  domain: i2c
  question: I2C Fast-mode'da SDA/SCL yükselme süresi (tr) en fazla ne kadar olabilir?
  facts: [{parameter: [tr, rise time, yükselme], value: "300", unit: ns, conditions: [Fast-mode]}]
  note: UM10204, Fast-mode zamanlama tablosu.
- id: i2c-02
  status: draft
  kind: design
  domain: i2c
  question: I2C hattında pull-up direncini nasıl seçmeliyim?
  keywords: [["Rp(max)", "Rp max", "Rp(min)", "Rp min", "0.8473"], ["kapasit", "capacit", "Cb"]]
  note: Rp(min) ve Rp(max) formülleri; yükselme süresi, hat kapasitansı ve çekilen akım sınırına bağlı.
- id: i2c-03
  status: draft
  kind: design
  domain: i2c
  question: I2C hattını kartlar arasında ne kadar uzun çekebilirim?
  keywords: [["400 pF", "400pF", "kapasit", "capacit"]]
  note: Standart uzunluk vermez; hat kapasitansı sınırı ve yükselme süresi üzerinden cevaplanmalı.
- id: i2c-04
  status: draft
  kind: condition
  domain: i2c
  clarify: true
  question: I2C'de START sonrası tutma süresi tHD;STA en az ne kadar olmalı?
  keywords: [["4.0", "4,0"], ["0.6", "0,6"]]
  note: Moda göre değişir (Standard / Fast / Fast-mode Plus); sistem modu sormalı ya da her mod için değeri vermeli.

