# Example question set: 30 mixed questions for a library with ARINC-429, ARINC-818, COM Express, DDR, DisplayPort,
# Ethernet, general design, I2C, LPDDR4, PCIe, RS-422 and USB documents. NOT a validated benchmark.
#
# Every item is `status: draft`: the expected values are widely published facts, but nobody has checked them
# against YOUR document revisions. Check each item in the document (document, revision, physical page, value,
# unit, conditions), correct it if needed and set `status: expert_verified`. Until then the numbers in a report
# are indicative only (the report says so: "benchmark": false).
#
# Item fields (see techrag/evaluation.py):
#   question     the question as an engineer would ask it (Turkish or English)
#   kind         value | design | condition | comparison | unanswerable (for reading the report)
#   answerable   false = the library should NOT answer it (saying "not found" is the correct behaviour)
#   clarify      true = the answer depends on a condition the question leaves out; asking back is correct
#   document     substring of the expected document's title or file name (fill in from your library)
#   pages        physical page(s) holding the answer -> retrieval recall@k, page and location accuracy
#   facts        [{parameter: [names/symbols], value, unit, qualifier (min/typ/max), conditions: [...]}]
#   keywords     words the answer must contain; an inner list = alternatives
#   note         what to check / adjust for your library
#
# Faster way to fill document and page: ask the question in the app, then 👍 (right) or 👎 with the correct
# value and page; the Evaluation window turns that feedback into items of their own.

# ------------------------------------------------------------------ ARINC 429
- id: a429-01
  status: draft
  kind: value
  domain: arinc
  question: ARINC 429 yüksek hız modunda bit hızı nedir?
  facts: [{parameter: [high speed, yüksek hız, bit rate, bit hızı, hız], value: "100", unit: kbps}]
  note: ARINC 429 Part 1, elektriksel arayüz / bit hızı bölümü.
- id: a429-02
  status: draft
  kind: design
  domain: arinc
  question: Bir ARINC 429 vericisine en fazla kaç alıcı bağlayabilirim?
  keywords: ["20"]
  note: Verici başına alıcı sayısı sınırı (yük / giriş empedansı) - sayfayı ekleyin.
- id: a429-03
  status: draft
  kind: comparison
  domain: arinc
  question: ARINC 429 ve RS-422'de bir vericiye bağlanabilecek alıcı sayısı nasıl farklıdır?
  keywords: ["20", "10"]
  note: İki ayrı belgeden (ARINC 429 ve TIA-422) ayrı atıfla cevaplanmalı.

