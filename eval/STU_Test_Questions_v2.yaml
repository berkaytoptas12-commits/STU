# Puanlama:
#   keywords  cevabın doğrulanmış ifadelerinde geçmesi gereken parçalar; hepsi aranır (büyük/küçük harf fark etmez,
#             "1.5" ile "1,5" aynı sayılır). İç liste = seçenekler, biri yeterli.
#   note      beklenen cevap (değerlendirme sonuçlarında sorunun yanında görünür).
#   answerable: false  kütüphane cevaplamamalı; "bulunamadı" demek doğru davranış.
#
# Belge ve sayfa: `document` (belge adının bir parçası) ve `pages` (fiziksel sayfa) boş bırakıldı. Bunları
# doldurana kadar raporda erişim ölçüleri (recall@k, MRR) ve kaynak/sayfa doğruluğu anlamlı değildir; cevap
# doğruluğu yine ölçülür. Doldurup kontrol ettiğiniz maddeleri `status: expert_verified` yapın.

