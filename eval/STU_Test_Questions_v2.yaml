# ------------------------------------------------------------------ DDR
- id: ddr-01
  status: draft
  kind: value
  domain: ddr
  question: DDR4 SDRAM'in VDD besleme gerilimi nedir?
  keywords: ["1.2"]
  note: "Beklenen: 1.2 V."
- id: ddr-02
  status: draft
  kind: comparison
  domain: ddr
  question: DDR3 ile DDR4 arasındaki temel farklar nelerdir?
  keywords: ["1.5", "1.2", ["VPP", "2.5"], ["POD"], ["SSTL"], ["bank group", "bank grub", "banka grub", "bankgroup"]]
  note: >-
    Beklenen: VDD 1.5 V → 1.2 V; DDR4'te ek 2.5 V VPP beslemesi; I/O SSTL_15 → POD12; banka grubu (bank group)
    mimarisi (x4/x8'de 8 → 16 banka). İkisi de 8n prefetch ve BL8 kullanır. İki ayrı belgeden (DDR3 ve DDR4)
    ayrı atıfla cevaplanmalı.
- id: ddr-03
  status: draft
  kind: value
  domain: ddr
  question: DDR3 SDRAM hangi I/O (arayüz) standardını kullanır?
  keywords: [["SSTL_15", "SSTL-15", "SSTL15", "SSTL 15", "SSTL_1.5"]]
  note: "Beklenen: SSTL_15."
- id: ddr-04
  status: draft
  kind: value
  domain: ddr
  question: DDR4'te prefetch mimarisi nedir?
  keywords: [["8n", "8 n", "8-n", "8-bit prefetch", "8 bit prefetch"]]
  note: "Beklenen: 8n prefetch."
- id: ddr-05
  status: draft
  kind: value
  domain: ddr
  question: DDR4 için normal sıcaklık aralığında ortalama yenileme aralığı tREFI nedir?
  keywords: ["7.8"]
  note: "Beklenen: 7.8 µs (TC ≤ 85 °C)."
- id: ddr-06
  status: draft
  kind: unanswerable
  domain: ddr
  answerable: false
  question: DDR6 SDRAM için tRFC değeri nedir?
  note: "Cevaplanamaz: kütüphanede DDR6 dokümanı yok. Doğru davranış \"bulunamadı\" demektir."

