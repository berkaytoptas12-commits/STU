# Değerlendirme soru seti  —  çalıştırma:  techrag eval            (tam: arama + cevap)
#                                           techrag eval --retrieval-only   (LLM çağırmadan arama kalitesi)
#
# Her madde:
#   question      : kullanıcı sorusu
#   expected      : cevapta (ve getirilen pasajlarda) bulunması gereken ifadeler. HEPSİ gerekir.
#                   Bir madde liste ise alternatiflerdir: [["8.0 GT/s", "8 GT/s"]] -> ikisinden biri yeter.
#   expected_doc  : (isteğe bağlı) kaynak doküman adında/yolunda geçmesi gereken parça, örn. "UM10204"
#
# Buradaki beklenen değerler yaygın olarak bilinen, standart metinlerinde geçen değerlerdir. Kendi
# doküman revizyonlarınıza göre kontrol edin; mühendislerinizin gerçek sorularıyla seti büyütün.
# Doğruluğu artırmanın en etkili yolu: bu seti 100+ gerçek soruya çıkarıp her ayar değişikliğinde koşmak.

# ----------------------------------------------------------------- ARINC
- id: arinc-01
  domain: arinc
  question: ARINC 429 bir veri kelimesi kaç bitten oluşur?
  expected: ["32"]
- id: arinc-02
  domain: arinc
  question: ARINC 429 kelimesinde etiket (label) hangi bitlerde yer alır?
  expected: [["1-8", "1–8", "1 through 8", "1 to 8", "1 ile 8", "1'den 8", "1 - 8", "1 ila 8"]]
- id: arinc-03
  domain: arinc
  question: ARINC 429 yüksek hızda (high speed) veri hızı nedir?
  expected: ["100"]
- id: arinc-04
  domain: arinc
  question: ARINC 429 düşük hız modunda bit hızı aralığı nedir?
  expected: [["14.5", "14,5"]]
- id: arinc-05
  domain: arinc
  question: ARINC 429 kelimesinde parite biti hangi bittir ve hangi parite kullanılır?
  expected: ["32", ["odd", "tek"]]
- id: arinc-06
  domain: arinc
  question: ARINC 664 Part 7 (AFDX) için izin verilen BAG değerleri nelerdir?
  expected: ["128"]

