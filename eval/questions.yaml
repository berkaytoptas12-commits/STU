# Example question set — NOT a validated benchmark.
#
# Every item below is `status: draft`: the expected values are widely published facts, but nobody has checked
# them against YOUR document revisions. Numbers from this file are indicative only; `techrag eval` says so in
# its report ("benchmark": false). To build a real benchmark, have an engineer verify each item against the
# loaded PDF (document, revision, physical page, value, unit, conditions) and set `status: expert_verified`.
#
#   techrag eval                    retrieval + answers
#   techrag eval --retrieval-only   no LLM: recall@k / MRR only
#
# Item fields (see techrag/evaluation.py):
#   question     user question (TR or EN)
#   answerable   false = the library should NOT answer it (abstaining is the correct behaviour)
#   document     substring of the expected source document title/path, e.g. "JESD79-4"   (recommended)
#   revision     expected document revision (optional)
#   pages        physical page index(es) holding the answer -> recall@k, page and location accuracy
#   facts        [{parameter: [names/symbols], value, unit, qualifier (min/typ/max), conditions: [...]}]
#                each must be stated correctly in ONE statement; "not X but Y" or a second value with the
#                same unit for the same parameter counts as wrong
#   keywords     non-numeric expectations; an inner list = alternatives
#
# Grow the set to a few hundred real questions from your engineers, including questions the library can NOT
# answer, and tune parsing/chunking/reranking on recall@k BEFORE touching prompts.

# ----------------------------------------------------------------- ARINC
- id: arinc-01
  status: draft
  domain: arinc
  question: ARINC 429 bir veri kelimesi kaç bitten oluşur?
  facts: [{parameter: [bit, bits, kelime, word], value: "32"}]
- id: arinc-02
  status: draft
  domain: arinc
  question: ARINC 429 kelimesinde etiket (label) hangi bitlerde yer alır?
  keywords: [["1-8", "1–8", "1 through 8", "1 to 8", "1 ile 8", "1'den 8", "1 - 8", "1 ila 8"]]
- id: arinc-03
  status: draft
  domain: arinc
  question: ARINC 429 yüksek hızda (high speed) veri hızı nedir?
  facts: [{parameter: [high speed, yüksek hız, hız, rate, bit rate], value: "100", unit: kbps}]
- id: arinc-04
  status: draft
  domain: arinc
  question: ARINC 429 düşük hız modunda bit hızı aralığı nedir?
  keywords: [["14.5", "14,5"]]
- id: arinc-05
  status: draft
  domain: arinc
  question: ARINC 429 kelimesinde parite biti hangi bittir ve hangi parite kullanılır?
  keywords: ["32", ["odd", "tek"]]
- id: arinc-06
  status: draft
  domain: arinc
  question: ARINC 664 Part 7 (AFDX) için izin verilen BAG değerleri nelerdir?
  keywords: ["128"]

