# ------------------------------------------------------------------ USB
- id: h-usb-01
  status: draft
  kind: design
  domain: usb
  question: USB 2.0 High-Speed modunda 8b/10b kodlamanın getirdiği ek yük (overhead) yüzde kaçtır?
  keywords: ["NRZI"]
  note: >-
    [yanlış öncül] Beklenen: USB 2.0 8b/10b kullanmaz; NRZI ve bit stuffing kullanır (6 ardışık 1'den sonra bir 0
    eklenir, ek yük veriye bağlıdır). 8b/10b USB 3.x 5 Gbps içindir. "%20" diye cevaplamak yanlıştır.
- id: h-usb-02
  status: draft
  kind: value
  domain: usb
  question: USB 2.0 High-Speed modunda hat sonlandırması ve diferansiyel sinyal genliği nedir?
  keywords: ["45", "400"]
  note: "[tablo] Beklenen: her hat 45 Ω ile toprağa sonlandırılır (90 Ω diferansiyel); HS sinyal genliği 400 mV (±%10)."
- id: h-usb-03
  status: draft
  kind: design
  domain: usb
  question: >-
    USB 2.0'da Full-Speed ve Low-Speed cihazlar hızlarını hosta nasıl bildirir? Pull-up direnci hangi hatta ve kaç
    ohm olmalıdır?
  keywords: [["1.5 k", "1.5k", "1500"], ["D+"], ["D-", "D−", "D–"]]
  note: >-
    [tasarım] Beklenen: 1.5 kΩ pull-up (3.0–3.6 V'a): Full-Speed (ve HS cihazın başlangıcı) D+ hattında, Low-Speed
    D− hattında. Hostta her iki hatta 15 kΩ pull-down vardır.
- id: h-usb-04
  status: draft
  kind: value
  domain: usb
  question: USB 2.0'da bir cihaz yapılandırılmadan (unconfigured) önce ve high-power olarak yapılandırıldıktan sonra VBUS'tan en fazla ne kadar akım çekebilir?
  keywords: [["100 ma", "100ma"], ["500 ma", "500ma"]]
  note: "[tablo] Beklenen: yapılandırılmadan önce 100 mA (1 birim yük); yapılandırıldıktan sonra en fazla 500 mA (5 birim yük)."

