              "acknowledge bulunmaz", "onay yok", "onay biti yok", "onay biti bulunmaz", "onay vermez", "no ack",
              "without acknowledge"]]
  note: >-
    [yanlış öncül] Beklenen: Ultra Fast-mode (5 Mbit/s) tek yönlüdür, hedef ACK vermez; 9. bit controller
    tarafından high sürülür. Bir ACK süresi vermek yanlıştır.

