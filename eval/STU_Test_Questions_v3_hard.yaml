# ------------------------------------------------------------------ Ethernet
- id: h-eth-01
  status: draft
  kind: value
  domain: ethernet
  question: >-
    100 Mb/s Ethernet'te yalnızca minimum boyutlu çerçeveler gönderilirse saniyede en fazla kaç çerçeve
    gönderilebilir?
  keywords: ["84", ["148 809", "148809", "148.809", "148 810", "148810", "148.810", "148.8 k", "148,8 bin"]]
  note: >-
    [hesap] Beklenen: 64 bayt çerçeve + 7 bayt preamble + 1 bayt SFD + 12 bayt IPG = 84 bayt = 672 bit →
    100 Mb/s / 672 bit ≈ 148 810 çerçeve/s.
