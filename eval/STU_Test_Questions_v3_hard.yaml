  status: draft
  kind: value
  domain: ddr
  question: DDR4'te RZQ direnci kaç ohm'dur ve RTT_NOM için seçilebilen değerler nelerdir?
  keywords: ["240", ["RZQ/4", "60"], ["RZQ/2", "120"], ["RZQ/7", "34"]]
  note: >-
    [tablo] Beklenen: RZQ = 240 Ω. RTT_NOM (MR1): kapalı, RZQ/4 (60 Ω), RZQ/2 (120 Ω), RZQ/6 (40 Ω), RZQ/1
    (240 Ω), RZQ/5 (48 Ω), RZQ/3 (80 Ω), RZQ/7 (34 Ω).
- id: h-ddr-03
  status: draft
  kind: value
  domain: ddr
  question: DDR4 yazma işleminde DQS ile CK arasında izin verilen zaman farkı (tDQSS) nedir?
  keywords: ["0.27"]
  note: "[tablo] Beklenen: −0.27 tCK … +0.27 tCK (1 saat çevrimi preamble ile). DDR3'teki ±0.25 tCK ile karıştırılmamalı."
- id: h-ddr-04
  status: draft
  kind: value
  domain: ddr
  question: LPDDR4 bir die'da kaç kanal içerir ve her kanalın veri genişliği kaç bittir?
  keywords: ["16", ["2 kanal", "iki kanal", "2 bağımsız kanal", "iki bağımsız", "2 adet", "iki adet", "2 x16", "2×16",
                    "2 × 16", "2x16", "two channel", "2 channel", "dual-channel", "dual channel", "channel a",
                    "kanal a"]]
  note: "[tasarım] Beklenen: Die başına 2 bağımsız kanal (A ve B), kanal başına 16 bit (x16)."
- id: h-ddr-05
  status: draft
  kind: condition
  domain: ddr
  clarify: true
  question: DDR4'te minimum tCK(avg) değeri nedir?
  keywords: ["0.625", ["0.833", "0.83", "0.75"]]
  note: >-
    [koşul] Hız sınıfına (speed bin) bağlı: ör. DDR4-2400 0.833 ns, DDR4-2666 0.750 ns, DDR4-3200 0.625 ns.
    Sistem hız sınıfını sormalı ya da her hız sınıfı için değeri vermeli.
- id: h-ddr-06
  status: draft
  kind: unanswerable
  domain: ddr
  answerable: false
  question: LPDDR5'te VDD2H besleme gerilimi nedir?
  note: >-
    [tuzak] Kütüphanede LPDDR4 var, LPDDR5 yok: LPDDR4'ün VDD2 değeriyle (1.1 V) cevap vermek yanlıştır, doğru
    davranış "bulunamadı" demektir. Kütüphanede LPDDR5 belgesi varsa answerable: true yapın (beklenen 1.05 V).

