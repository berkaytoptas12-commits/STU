  status: draft
  kind: value
  domain: ethernet
  question: 1000BASE-T bakır kablo üzerinde hangi modülasyonu, kaç çifti ve hangi sembol hızını kullanır?
  keywords: [["PAM-5", "PAM5", "PAM 5"], ["4 çift", "dört çift", "4 kablo çifti", "dört kablo", "4 pair",
                                            "four pair"], ["125"]]
  note: >-
    [tablo] Beklenen: 4D-PAM5, dört çiftin hepsi her iki yönde (eko iptaliyle), çift başına 125 Mbaud
    (çift başına 250 Mb/s).
- id: h-eth-03
  status: draft
  kind: value
  domain: ethernet
  question: Etiketsiz ve 802.1Q (VLAN) etiketli Ethernet çerçevesinin maksimum boyutu nedir?
  keywords: ["1518", "1522"]
  note: "[tablo] Beklenen: 1518 bayt; Q-etiketiyle 1522 bayt (preamble/SFD hariç)."
- id: h-eth-04
  status: draft
  kind: value
  domain: ethernet
  question: Half-duplex Ethernet'te slot time nedir ve 1000 Mb/s half-duplex'te nasıl değişir?
  keywords: ["512", ["4096", "512 bayt", "512 byte", "carrier extension", "taşıyıcı uzatma"]]
  note: >-
    [tablo] Beklenen: 10/100 Mb/s'de 512 bit süresi; 1000 Mb/s half-duplex'te 4096 bit süresi (512 bayt,
