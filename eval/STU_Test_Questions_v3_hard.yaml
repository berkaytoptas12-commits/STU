# Sayısal Tasarım Uzmanı - Soru-Cevap Seti v3, zor (39 soru)
# v2 ile aynı bölümler ve soru sayısı. Değerlendirme penceresinde "Kendi dosyanız" ile yükleyin.
#
# Zorluk türleri (note alanının başında yazar):
#   [hesap]          cevap standarttaki değerlerden hesaplanır (girdiler kaynaktan gelmeli)
#   [tablo]          bir tablonun belirli satırı/sütunu veya koşulu gerekir
#   [koşul]          cevap soruda verilmeyen bir koşula bağlı (clarify: true): netleştirme sorması doğru;
#                    her koşul için değeri verirse anahtar kelimelerle puanlanır
#   [yanlış öncül]   sorunun varsayımı yanlış; doğru cevap öncülü düzeltmektir
#   [tuzak]          kütüphanede yakın ama farklı bir belge var (answerable: false); o belgeden cevap vermek yanlış
#   [tasarım]        tasarım diliyle sorulmuş; cevap standardın gereksinimidir
#
# Beklenen cevaplar yaygın yayımlanmış değerlerdir ama kendi belge revizyonlarınıza göre kontrol EDİLMEDİ
# (status: draft). Her maddeyi belgede kontrol edin, gerekirse düzeltin, `document` ve `pages` alanlarını doldurun
# ve `status: expert_verified` yapın. Belge/sayfa doldurulana kadar erişim ölçüleri (recall@k, MRR) ve
# kaynak/sayfa doğruluğu anlamlı değildir; cevap doğruluğu yine ölçülür.
#
# keywords: hepsi aranır (büyük/küçük harf fark etmez, "1.5" = "1,5"); iç liste = seçenekler, biri yeterli.

# ------------------------------------------------------------------ ARINC
- id: h-arinc-01
  status: draft
  kind: value
  domain: arinc
  question: >-
    ARINC 429 yüksek hızda kelimeler arasında izin verilen en kısa boşlukla art arda gönderildiğinde bir kelime
    kaç µs sürer ve saniyede en fazla kaç kelime gönderilebilir?
  keywords: ["320", "360", ["2777", "2778", "2.777", "2.778", "2 777", "2 778"]]
  note: >-
    [hesap] Beklenen: 32 bit × 10 µs = 320 µs; kelimeler arası en az 4 bit süresi boşluk → 36 bit süresi = 360 µs
    → saniyede en fazla ≈ 2778 kelime. Girdiler: 100 kbps ve 4 bitlik kelime boşluğu (ARINC 429 Part 1).
- id: h-arinc-02
  status: draft
  kind: value
  domain: arinc
  question: ARINC 429 BNR verisinde SSM bitleri (bit 30–31) hangi durumları kodlar?
  keywords: [["failure warning", "arıza uyarı", "hata uyarı"], ["no computed data", "NCD", "hesaplanmış veri yok"],
             ["functional test", "fonksiyonel test", "işlevsel test"], ["normal operation", "normal çalışma",
             "normal operasyon"]]
  note: >-
    [tablo] Beklenen: bit 31-30 = 00 Failure Warning, 01 No Computed Data, 10 Functional Test, 11 Normal
    Operation. BCD ve ayrık (discrete) veride SSM anlamları farklıdır; BNR tablosu kullanılmalı.
- id: h-arinc-03
  status: draft
  kind: value
  domain: arinc
  question: ARINC 429 alıcısı hangi diferansiyel gerilim aralıklarını HI, NULL ve LO olarak kabul etmelidir?
  keywords: ["6.5", "13", "2.5"]
  note: >-
    [tablo] Beklenen: HI +6.5 V … +13 V, NULL +2.5 V … −2.5 V, LO −6.5 V … −13 V (alıcı girişi, A-B arası).
    Vericinin çıkış seviyeleriyle (+10 V / 0 V / −10 V) karıştırılmamalı.
- id: h-arinc-04
  status: draft
  kind: comparison
  domain: arinc
  question: ARINC 429 vericisinde yükselme/düşme süreleri yüksek hız ve düşük hız için ne olmalıdır?
  keywords: ["1.5", "0.5", ["10 ± 5", "10±5", "10 ±5", "± 5", "±5"]]
  note: "[tablo] Beklenen: yüksek hız 1.5 ± 0.5 µs, düşük hız 10 ± 5 µs."
- id: h-arinc-05
  status: draft
  kind: design
  domain: arinc
  question: >-
    ARINC 429 kelimesi hatta hangi bit sırasıyla gönderilir? Etiket (label) alanı için bir istisna var mı?
  keywords: [["MSB", "most significant", "en anlamlı", "en yüksek değerlikli", "en önemli bit"]]
  note: >-
    [tasarım] Beklenen: bit 1 ilk, bit 32 (parite) son gönderilir. Etiket (bit 1-8, sekizli/octal) ters
    yerleştirilmiştir: etiketin en anlamlı biti (MSB) bit 1'dedir, yani etiket MSB önce gider; veri alanları
    LSB önce gider. Yazılımda etiketin bit sırasını ters çevirmek gerekir.
- id: h-arinc-06
  status: draft
  kind: design
  domain: arinc
  question: ARINC 818'de "container" (kapsayıcı) nedir ve bir video karesi hat üzerinde nasıl taşınır?
  keywords: [["kare", "frame", "görüntü", "image"], ["ADVB"], ["header", "başlık"]]
  note: >-
    [tasarım] Beklenen: Bir container bir video karesinin (görüntünün) tamamını ve container header'ını taşır;
    bir dizi ADVB çerçevesiyle gönderilir. İlk ADVB çerçevesi container header'ı (Object 0) ve varsa yardımcı
    veriyi (Object 1) taşır; video satırları sonraki çerçevelerde (Object 2/3) gelir. Belgedeki tanıma göre
    kontrol edin.

# ------------------------------------------------------------------ DDR
- id: h-ddr-01
  status: draft
  kind: value
  domain: ddr
  question: DDR4 85 °C ile 95 °C arasında çalışırken ortalama yenileme aralığı tREFI ne olmalıdır?
  keywords: ["3.9"]
  note: >-
    [tablo] Beklenen: 3.9 µs (85 °C < TC ≤ 95 °C'de yenileme iki kat sıklaşır; normal aralıkta 7.8 µs).
