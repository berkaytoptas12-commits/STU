# ------------------------------------------------------------------ I2C
- id: h-i2c-01
  status: draft
  kind: value
  domain: i2c
  question: >-
    VDD = 3.3 V olan Standard-mode bir I2C hattında pull-up direnci en az kaç ohm olabilir (VOL(max) = 0.4 V,
    IOL = 3 mA)?
  keywords: [["966", "967", "0.97"]]
  note: "[hesap] Beklenen: Rp(min) = (VDD − VOL(max)) / IOL = (3.3 − 0.4) / 3 mA ≈ 967 Ω."
- id: h-i2c-02
  status: draft
  kind: value
  domain: i2c
  question: Fast-mode'da hat kapasitansı 200 pF ise pull-up direnci en fazla kaç ohm olabilir?
  keywords: [["1770", "1771", "1.77", "1.8 k"]]
  note: >-
    [hesap] Beklenen: Rp(max) = tr / (0.8473 × Cb) = 300 ns / (0.8473 × 200 pF) ≈ 1770 Ω (Fast-mode tr(max) =
    300 ns).
