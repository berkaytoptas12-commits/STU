[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "techrag"
version = "0.3.0"
description = "Source-grounded, verification-first assistant for hardware interface and design standards"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "httpx>=0.25",
  "pymupdf>=1.24",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "truststore>=0.9; python_version >= '3.10'",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
techrag = "techrag.cli:main"

[project.gui-scripts]
techrag-desktop = "techrag.desktop:main"

[tool.setuptools.packages.find]
include = ["techrag*"]

[tool.setuptools.package-data]
techrag = ["web/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
