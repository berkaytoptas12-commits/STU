name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt -r requirements-dev.txt "pyinstaller>=6.10"
      - name: Tests on Windows
        run: python -m pytest -q
      - name: Build (one folder)
        run: pyinstaller packaging/techrag.spec --noconfirm
      - name: Build (single portable exe)
        env:
          TECHRAG_ONEFILE: "1"
        run: pyinstaller packaging/techrag.spec --noconfirm
      - name: Self-test the frozen builds
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/TechRAG/TechRAG.exe -ArgumentList "selftest","selftest-onedir.json" -Wait -PassThru
          Get-Content selftest-onedir.json
          if ($p.ExitCode -ne 0) { throw "onedir selftest failed" }
          $p = Start-Process -FilePath dist/TechRAG-portable.exe -ArgumentList "selftest","selftest-onefile.json" -Wait -PassThru
          Get-Content selftest-onefile.json
          if ($p.ExitCode -ne 0) { throw "onefile selftest failed" }
          $j = Get-Content selftest-onedir.json | ConvertFrom-Json
          if ($j.pywebview -ne $true) { throw "pywebview not bundled: $($j.pywebview)" }
      - name: GUI smoke test (real WebView2 window, both builds)
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA "TechRAG/techrag.log"
          foreach ($exe in @("dist/TechRAG/TechRAG.exe", "dist/TechRAG-portable.exe")) {
            $name = [IO.Path]::GetFileNameWithoutExtension($exe)
            $out = Join-Path $PWD "smoke-$name.json"
            $env:TECHRAG_SMOKE = $out
            Write-Host "=== $exe"
            $p = Start-Process -FilePath $exe -PassThru
            if (-not $p.WaitForExit(240000)) {
              Stop-Process -Id $p.Id -Force
              Get-Content $log -Tail 120 -ErrorAction SilentlyContinue
              throw "$exe did not finish: the window hung (not responding)"
            }
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
            if (-not (Test-Path $out)) { throw "$exe exited (code $($p.ExitCode)) without a smoke result - crashed" }
            Get-Content $out
            $j = Get-Content $out | ConvertFrom-Json
            if (-not $j.ok) { throw "$exe GUI smoke test failed" }
          }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/TechRAG -DestinationPath TechRAG-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TechRAG-windows
          path: |
            TechRAG-win64.zip
            dist/TechRAG-portable.exe
          retention-days: 30
      - name: Publish GitHub Release (tag push or manual run with release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TechRAG ${{ inputs.release_tag || github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: |
            TechRAG-win64.zip
            dist/TechRAG-portable.exe
